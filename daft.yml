# The team-recommended layout: `<repo>/.git` bare, one directory per branch.
layout: contained

# Merge policy — what makes a green pre-merge ring mean anything.
# `source_worktree: clean` closes the gap between the working tree the rings
# see and the committed tree that merges. Rebase first, then
# `daft merge <branch> --into main -F <message>`.
#
# No `ff: only`: merges are squashes (the style is `daft.merge.style`, a git
# config — daft.yml has no key for it), and a squash can never fast-forward.
# The half of it worth keeping — refusing a branch that doesn't already
# contain the target's tip, which is what makes "the tree the rings tested is
# the tree that lands" true — is the `source-up-to-date` ring below.
merge:
  source_worktree: clean

# The merge policy and pre-merge hooks above need a daft that enforces them.
min_version: "1.27.2"

# The gitignored build cache, replicated into every new worktree before the
# post-create hooks run, so the background build below reconciles a warm
# `target/` instead of compiling every dependency again. `fallback: skip`: on
# a filesystem that cannot reflink, skip it rather than byte-copy gigabytes.
copy:
  paths:
    - target/
  fallback: skip

hooks:
  worktree-post-create:
    jobs:
      - name: mise-trust
        run: mise trust
      - name: setup
        description: Pinned tools, the crates, the git hooks — cached on its inputs
        run: mise run setup
        needs: [mise-trust]
      - name: cargo-build
        run: mise run build
        needs: [setup]
        background: true

  # The local quality gate. It runs BEFORE main's ref moves, which CI cannot:
  # the `main: PR gate` ruleset lets the maintainer's `daft merge` + push
  # through, and CI only sees that push afterwards. Every ring is the same
  # `mise run` task the git hooks and CI call, so a check has one definition;
  # `mise run gate` is the set by hand.
  #
  # Rings run in the SOURCE worktree (`root`): that is where the branch's code
  # lives and where its caches are warm. The `merge:` policy above is what
  # makes that safe. Parallel (the default) on purpose — a gate surfaces every
  # problem in one pass; cargo's own build lock serializes the rings that
  # share a build directory.
  #
  # `tags: [deep]` marks the slow ring: drop it for a quick pass with
  # `daft merge --skip-tag deep`, never by trimming it from the gate.
  pre-merge:
    jobs:
      - name: source-up-to-date
        description: "The branch already contains the target's tip, so the tested tree is the landed tree"
        root: "{merge_source_path}"
        run: git merge-base --is-ancestor "$DAFT_MERGE_TARGET_BRANCH" HEAD

      - name: guard
        description: "Hard-rule tripwires — tokens, network, spawns, agent homes, dependencies, pins"
        root: "{merge_source_path}"
        run: mise run guard

      - name: lint-shell
        description: "shellcheck over every script (pre-commit only ever saw staged files)"
        root: "{merge_source_path}"
        run: mise run lint-shell

      - name: fmt-check
        description: "cargo fmt, check only"
        root: "{merge_source_path}"
        run: mise run fmt-check

      - name: check-config
        description: "lefthook.yml, daft.yml and mise.toml parse"
        root: "{merge_source_path}"
        run: mise run check-config

      - name: test-hooks
        description: "The hook scripts' own pass and refusal paths, in a throwaway repo"
        root: "{merge_source_path}"
        run: mise run test-hooks

      - name: incoming-commits
        description: "Every commit the merge would land has a conventional subject (catches --no-verify)"
        root: "{merge_source_path}"
        run: mise run merge-commits

      - name: clippy
        description: "Clippy over every target, warnings denied"
        root: "{merge_source_path}"
        run: mise run clippy

      - name: test
        description: "The whole suite"
        root: "{merge_source_path}"
        run: mise run test

      - name: deny
        description: "Advisories, licenses, sources, and the ban on network crates"
        root: "{merge_source_path}"
        run: mise run deny

      - name: release-build
        description: "What a person would install builds: release profile, not a dev build"
        root: "{merge_source_path}"
        tags: [deep]
        run: mise run release-build

  # Tripwires. Warn rather than abort (also the default for post-merge): the
  # ref has already moved, so an error exit would report a verdict on work
  # that is done — the useful outcome is a loud notice.
  post-merge:
    fail_mode: warn
    jobs:
      - name: landed-matches-gated
        description: The landed tree is the tree the rings tested
        run: mise run landed-check
      - name: release-reminder
        description: Unreleased feat/fix on main means a release is owed
        run: mise run release-reminder

relations:
  - url: git@github.com:avihut/coding-agent-usage-tracker.git
    name: agent-usage
