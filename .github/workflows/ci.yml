# The PR gate: the same `mise run gate` the git hooks and daft's merge gate
# run, on GitHub's runners — a merge made with GitHub's button never passes
# through daft's pre-merge rings, so this is what stands in for them.
#
# Hardening, deliberately:
#   - `pull_request`, NEVER `pull_request_target`: a fork's code runs with a
#     read-only token and no secrets, and there are no secrets here to reach.
#   - every action pinned to a full commit SHA (the repo setting requires it,
#     and scripts/guard.sh says so first).
#   - nothing from the event is interpolated into a shell line.
# This workflow builds and tests. It never calls a harness, never touches the
# network beyond fetching tools and crates, and never publishes.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # check-config validates daft.yml with daft itself. Before mise sets a
      # CARGO_HOME of its own, so the installer's default location holds.
      - name: Install daft
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/avihut/daft/releases/latest/download/daft-installer.sh | sh
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Gate
        run: mise run gate

  # THE required check (`main: PR gate` ruleset; scripts/guard.sh holds the
  # spelling). One aggregate, so the ruleset never has to name a matrix leg —
  # and `if: always()` with an explicit verdict, because a job that is SKIPPED
  # when its `needs` fail reports as green to a required-check rule.
  gate:
    name: gate
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        env:
          RESULT: ${{ needs.test.result }}
        run: |
          echo "test: $RESULT"
          [ "$RESULT" = "success" ]
